apiVersion: v1
kind: ConfigMap
metadata:
  name: claudio-config
  namespace: claudio
data:
  TZ: Europe/Berlin
  # Public URL of the web UI: SvelteKit CSRF origin check, OAuth callback, links in PR comments, webhook target
  ORIGIN: https://claudio.stadtlandnetz.de
  PUBLIC_BASE_URL: https://claudio.stadtlandnetz.de
  # Who may sign in (comma-separated GitHub organisations / users). With lists for GitHub only,
  # nobody can sign in with GitLab: set the GitLab lists before connecting GitLab.
  CLAUDIO_ALLOWED_GITHUB_ORGS: StadtLandNetz
  CLAUDIO_ALLOWED_GITHUB_USERS: ''
  # GitLab (optional): the instance, and who may sign in (group paths / user names)
  GITLAB_URL: https://gitlab.com
  CLAUDIO_ALLOWED_GITLAB_GROUPS: ''
  CLAUDIO_ALLOWED_GITLAB_USERS: ''
  # Runs at the same time. Each run starts a Chromium and a Claude Code session (~0.5–1 GB RAM);
  # raise together with the worker's memory limit.
  CLAUDIO_WORKER_CONCURRENCY: '1'
  # Screenshots (stored in the database) older than this are deleted; reports stay
  CLAUDIO_ARTIFACT_RETENTION_DAYS: '14'
  # Run directories (traces, checkouts) older than this are deleted; the directory is ephemeral anyway
  CLAUDIO_RUN_RETENTION_DAYS: '14'
  # How long a run waits for a person to solve a CAPTCHA before giving up
  CLAUDIO_HUMAN_TIMEOUT_MIN: '15'
