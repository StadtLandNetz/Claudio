# The ONE secret of this deployment – do NOT commit real values. Easiest: ./tools/create-k8s-secret.sh
#
# Keys:
#   DATABASE_URL            MySQL connection string for web + worker
#   DATABASE_MIGRATION_URL  optional: same database, a user WITH CREATE/ALTER/DROP/INDEX/REFERENCES – used only by
#                           the migrate init container
#   CLAUDIO_SECRET_KEY      encrypts GitHub tokens, role credentials, webhook secrets and Anthropic keys in the
#                           database (openssl rand -base64 32). Back it up: without it all of them are unreadable.
#   GITHUB_CLIENT_ID        GitHub OAuth App (callback: https://<host>/auth/github/callback)
#   GITHUB_CLIENT_SECRET
#   .dockerconfigjson       registry login for pulling the private GHCR image
#
# There is no server-wide Anthropic key on purpose: every repository carries its own (Repo → Einstellungen).
apiVersion: v1
kind: Secret
metadata:
  name: claudio-secrets
  namespace: claudio
type: kubernetes.io/dockerconfigjson
stringData:
  DATABASE_URL: mysql://claudio:CHANGE_ME@mysql.example.internal:3306/claudio
  # optional – omit when the app user itself may run DDL
  DATABASE_MIGRATION_URL: mysql://claudio_migrate:CHANGE_ME@mysql.example.internal:3306/claudio
  CLAUDIO_SECRET_KEY: CHANGE_ME_openssl_rand_base64_32
  GITHUB_CLIENT_ID: CHANGE_ME
  GITHUB_CLIENT_SECRET: CHANGE_ME
  # {"auths":{"ghcr.io":{"auth":"<base64 of user:PAT>"}}}
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"CHANGE_ME"}}}'
