# Run directories: screenshots, traces, live frames, checkouts. Written by the worker, served by the web UI –
# both containers run in the same pod (deployment.yaml), so ReadWriteOnce is enough.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claudio-runs
  namespace: claudio
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 20Gi
